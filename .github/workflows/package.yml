# Package workflow builds and smoke-tests the installable tarball.
name: Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Smoke-test package
        run: make package-smoke GOOS=linux GOARCH=amd64
      - name: Build release artifact set
        run: make release-artifacts VERSION=0.1.0-ci
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: devrail-router-release-artifacts
          path: |
            dist/*.tar.gz
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
